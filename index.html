      `<b>The axes follow <a href="https://www.politicalcompass.org" target="_blank" rel="noopener">the Political Compass</a>.</b> Horizontal is economics: state ownership, redistribution and public provision on the left; free markets and private enterprise on the right. Vertical is authority, kept separate from economics: one-party rule, censorship, the death penalty, nationalism and enforced moral codes at the top; civil liberties and limits on state power at the bottom.`,

      `<b>Shifts are drawn only from evidence that passes the same tests.</b> A solid arrow means both ends are at least medium confidence; a dashed one means one end rests on a single signal. The arrow says where someone stood then and stands now, not why they moved: the axes measure fixed positions, not whether someone is against whoever is in power.`,

      `<b>Who is included:</b> people who are either widely known or have a substantial political record, up to 200. Genre is shown by colour and shape together, and is a filing decision, not a claim.`,

function poly(x,y,pts){return `<polygon class="d" points="${pts.map(p=>(x+p[0]).toFixed(1)+","+(y+p[1]).toFixed(1)).join(" ")}"/>`}
function ngon(n,r,rot,r2){const a=[],m=r2?n*2:n;for(let i=0;i<m;i++){const t=rot+i*2*Math.PI/m,rr=r2&&i%2?r2:r;a.push([rr*Math.sin(t),-rr*Math.cos(t)])}return a}
const SH={R:(x,y)=>`<circle class="d" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5.6"/>`,
 P:(x,y)=>poly(x,y,ngon(3,7.6,0)),M:(x,y)=>poly(x,y,ngon(4,7.2,Math.PI/4)),O:(x,y)=>poly(x,y,ngon(4,7.2,0)),
 H:(x,y)=>poly(x,y,ngon(3,7.6,Math.PI)),C:(x,y)=>poly(x,y,ngon(5,7,0)),F:(x,y)=>poly(x,y,ngon(5,8,0,3.6)),
 E:(x,y)=>poly(x,y,[[-2.2,-6.6],[2.2,-6.6],[2.2,-2.2],[6.6,-2.2],[6.6,2.2],[2.2,2.2],[2.2,6.6],[-2.2,6.6],[-2.2,2.2],[-6.6,2.2],[-6.6,-2.2],[-2.2,-2.2]])};

function clamp(){const h=10/st.k;st.cx=Math.max(-10+h,Math.min(10-h,st.cx));st.cy=Math.max(-10+h,Math.min(10-h,st.cy))}
function zoomAt(X,Y,f){const u=ux(X),v=uy(Y);st.k=Math.max(1,Math.min(KMAX,st.k*f));const U=UU();st.cx=u-(X-M-P/2)/U;st.cy=v+(Y-M-P/2)/U;clamp();req()}
let anim=0;
function animateTo(k,cx,cy,ms=300){cancelAnimationFrame(anim);const k0=st.k,x0=st.cx,y0=st.cy,t0=performance.now();k=Math.max(1,Math.min(KMAX,k));
 const h=10/k;cx=Math.max(-10+h,Math.min(10-h,cx));cy=Math.max(-10+h,Math.min(10-h,cy));
 const step=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);st.k=Math.exp(Math.log(k0)+(Math.log(k)-Math.log(k0))*e);st.cx=x0+(cx-x0)*e;st.cy=y0+(cy-y0)*e;clamp();draw();if(p<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function zoomTo(X,Y,f){const u=ux(X),v=uy(Y),k=Math.max(1,Math.min(KMAX,st.k*f)),U=P/20*k;animateTo(k,u-(X-M-P/2)/U,v+(Y-M-P/2)/U)}

function init(data){

 const rk=f=>{const r={};D.slice().sort(f).forEach((d,i)=>r[d.name]=i);return r},R1=rk((a,b)=>(b.langs||0)-(a.langs||0)||(b.views||0)-(a.views||0)),R2=rk((a,b)=>(b.lfm||0)-(a.lfm||0));
 D.forEach(d=>d.pop=d.lfm?(R1[d.name]+R2[d.name])/2:R1[d.name]);const byPop=D.slice().sort((a,b)=>a.pop-b.pop);
 const far={};D.forEach(d=>{if(!d.econ||!d.auth)return;const k=(d.auth>0?"auth":"lib")+"-"+(d.econ>0?"right":"left");if(!far[k]||Math.hypot(d.econ,d.auth)>Math.hypot(far[k].econ,far[k].auth))far[k]=d});

 const n=()=>D.filter(e=>e.starter).length;byPop.forEach(d=>{if(n()<50&&!d.starter&&d.confidence>1){d.starter=1;d.why="among the most widely known (Wikipedia languages and Last.fm listeners)"}});

 const shiftBasis = (d.shift && currentLang === "tr" && d.shift.basis_tr) ? d.shift.basis_tr : (d.shift ? d.shift.basis : "");

 $("sh").style.transform="";
 $("sh").innerHTML=`<div class="grab" id="grab"></div><div class="sh-h"><div><h3 id="shName">${esc(d.name)}</h3><div class="meta">${esc(d.band==="solo"?t("solo"):d.band)} · ${t("genres")[d.genre]}${d.start?` · ${currentLang==='tr'?'kariyer: ':'career began '}${d.start}`:""}</div></div><button class="x" aria-label="Close" id="shX">&times;</button></div>
 <div class="why">${d.starter? (currentLang==='tr' ? `Başlangıç 50'sinde: ${d.why}.` : `In the starting 50: ${d.why}.`) : (currentLang==='tr' ? "Tümü altında gösteriliyor." : "Shown under All.")} ${d.langs} ${t("languages")(d.langs===1)}, ${big(d.views)} ${t("engViews")}${d.lfm?` · ${big(d.lfm)} ${t("lastFmListeners")}${d.lfmAct&&d.lfmAct!==d.name?` ${t("asBand")(esc(d.lfmAct))}`:""}`:""}.</div>
 <div class="pos">${gauge(t("economic"),d.econ,(d.ce??d.confidence)===0?5:HX[d.ce??d.confidence],t("left"),t("right"),"e")}${gauge(t("authority"),d.auth,HR[d.ca??d.confidence],t("libertarian"),t("authoritarian"),"a")}<div class="pcf">${t("confLevels")[d.confidence]} ${currentLang==='tr'?'güvenilirlik':'confidence'}${(d.ce??d.confidence)===0?" · "+t("noEconRecord"):""}</div></div>${s}
 <p>${esc(basisText)}</p>${d.shift?`<p><i>${t("earlierPos")} (${esc(d.shift.label)}):</i> ${t("economic").toLowerCase()} ${fmt(d.shift.econ)} (&plusmn;${HX[d.shift.ce??1]}), ${t("authority").toLowerCase()} ${fmt(d.shift.auth)} (&plusmn;${HR[d.shift.ca??1]})${shWeak(d)?` · <b>${t("weakShift")}</b>`:""}. ${esc(shiftBasis)}${(d.shift.sources||[]).length?" "+d.shift.sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join("; "):""}</p>`:""}
 <h4>${t("sourcesH4")}</h4>${src.length?`<ol>${src.map(x=>`<li>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</li>`).join("")}</ol>`:`<p style="color:var(--mut)">${t("noneYet")}</p>`}
 <p class="wk" id="shW">${wkLink(d)}</p><div class="acts">${st.mode==="list"?`<button id="shGo">${t("showOnChart")}</button>`:""}<a href="${issue}" target="_blank" rel="noopener">${t("disputePlacement")}</a><button id="shL">${t("copyLink")}</button></div>`;
 
 $("sheet").hidden=false;$("shX").onclick=closeSheet;
 if($("shGo"))$("shGo").onclick=()=>focusOn(i);
 $("shL").onclick=e=>{const u=location.href.split("#")[0]+"#"+slug(d.name);try{navigator.clipboard.writeText(u).then(()=>e.target.textContent=t("copied"),()=>e.target.textContent=u)}catch(_){e.target.textContent=u}};
 req();
}

function closeSheet(){if(st.sel==null&&$("sheet").hidden)return;st.sel=null;$("sheet").hidden=true;req()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeF()}});
(()=>{const sh=$("sh");let y0=null,dy=0;
 sh.addEventListener("pointerdown",e=>{if(matchMedia("(min-width:1024px)").matches||!e.target.closest(".grab,.sh-h")||e.target.closest("button"))return;y0=e.clientY;dy=0;sh.classList.add("drag");sh.setPointerCapture(e.pointerId)});
 sh.addEventListener("pointermove",e=>{if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
 const up=()=>{if(y0==null)return;y0=null;sh.classList.remove("drag");if(dy>70)closeSheet();else sh.style.transform=""};
 sh.addEventListener("pointerup",up);sh.addEventListener("pointercancel",up)})();
function focusOn(i){setMode("chart");const d=D[i];if(!pass(d)){st.genres.clear();st.decades.clear();st.conf.clear();st.sourced=false;$("oV").checked=false;if(!d.starter)st.view="all";syncView()}openSheet(i);animateTo(Math.max(st.k,4),d.x,d.y,380);$("wrap").scrollIntoView({block:"nearest",behavior:"smooth"})}

// ---------- list ----------
function drawList(){
 let a=D.map((d,i)=>i).filter(i=>pass(D[i])&&(!st.q||hit(D[i])));
 const c={name:(x,y)=>D[x].name.localeCompare(D[y].name),econ:(x,y)=>D[x].econ-D[y].econ,auth:(x,y)=>D[x].auth-D[y].auth,src:(x,y)=>(D[y].sources.length>0)-(D[x].sources.length>0)||D[x].name.localeCompare(D[y].name),start:(x,y)=>(D[x].start||9999)-(D[y].start||9999),read:(x,y)=>(D[y].langs||0)-(D[x].langs||0)||(D[y].views||0)-(D[x].views||0),heard:(x,y)=>(D[y].lfm||0)-(D[x].lfm||0)}[st.sort];
 a.sort(c);if(st.rev)a.reverse();$("sdir").textContent=st.rev?"\u2191":"\u2193";$("sdir").setAttribute("aria-pressed",!!st.rev);
 $("lc").textContent=t("peopleCount")(a.length, a.length===1);
 $("list").innerHTML=a.length?a.map(i=>{const d=D[i];return `<button class="row" data-i="${i}">${icon(d.genre,d.confidence)}<span class="t"><b>${esc(d.name)}</b><small>${esc(d.band==="solo"?t("genres")[d.genre]:d.band+" · "+t("genres")[d.genre])}${d.start?" · "+d.start:""}</small></span><span class="p">${fmt(d.econ)}, ${fmt(d.auth)}<br>${st.sort==="read"?d.langs+" "+t("languages")(d.langs===1):st.sort==="heard"?big(d.lfm)+" "+t("lastFmListeners"):d.sources.length?`<span class="ok">&#10003; ${currentLang==='tr'?'kaynaklı':'sourced'}</span>`:(currentLang==='tr'?'kaynaksız':'unsourced')}</span></button>`}).join(""):`<div class="empty">${t("nobodyMatches")}</div>`}
$("list").addEventListener("click",e=>{const r=e.target.closest(".row");if(r)openSheet(+r.dataset.i)});
$("sort").onchange=e=>{st.sort=e.target.value;st.rev=false;drawList()};$("sdir").onclick=()=>{st.rev=!st.rev;drawList()};

// ---------- controls ----------
function setMode(m){st.mode=m;$("tabC").setAttribute("aria-selected",m==="chart");$("tabL").setAttribute("aria-selected",m==="list");$("vChart").hidden=m!=="chart";$("vList").hidden=m!=="list";if(m==="list"){drawList();document.querySelector(".tabs").scrollIntoView({block:"start"})}else resize()}
$("skipL").onclick=e=>{e.preventDefault();setMode("list");$("tabL").focus()};
$("vS").onclick=()=>setView("start");$("vS2").onclick=()=>setView("start");$("vA2").onclick=()=>setView("all");$("vA").onclick=()=>setView("all");
$("tabC").onclick=()=>setMode("chart");$("tabL").onclick=()=>setMode("list");
function toggle(set,k){if(k==null)set.clear();else set.has(k)?set.delete(k):set.add(k)}
$("chips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;toggle(st.genres,b.dataset.g||null);refresh()});
$("dchips").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;toggle(st.decades,b.dataset.d||null);refresh()});
const confClick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.o){$(b.dataset.o).click();syncView();return}toggle(st.conf,b.dataset.c?+b.dataset.c:null);refresh()};
$("cchips").addEventListener("click",confClick);$("leg").addEventListener("click",confClick);
$("pills").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const tData=b.dataset;
 if(tData.pg)st.genres.delete(tData.pg);if(tData.pd)st.decades.delete(tData.pd);if(tData.pk)st.conf.delete(+tData.pk);if(tData.ps){st.sourced=false;$("oV").checked=false}if(tData.pv)st.view="start";if(tData.pq){setQuad(null);return}
 if(tData.pc){if(st.quad){st.quad=null;animateTo(1,0,0)}st.genres.clear();st.decades.clear();st.conf.clear();st.sourced=false;$("oV").checked=false;st.view="start"}refresh()});
const openF=()=>{$("filters").classList.add("open");$("scrim").hidden=false},closeF=()=>{$("filters").classList.remove("open");$("scrim").hidden=true};
$("fOpen").onclick=openF;$("fClose").onclick=closeF;$("fDone").onclick=closeF;$("scrim").onclick=closeF;
$("fReset").onclick=()=>{st.genres.clear();st.decades.clear();st.conf.clear();st.sourced=false;$("oV").checked=false;st.view="start";refresh()};
function refresh(){syncView();if(st.sel!=null&&!pass(D[st.sel]))closeSheet();req();if(st.mode==="list")drawList()}
$("q").addEventListener("input",e=>{st.q=e.target.value.trim().toLowerCase();refresh()});
$("q").addEventListener("keydown",e=>{if(e.key!=="Enter")return;const i=D.findIndex(d=>pass(d)&&hit(d));if(i>=0){e.target.blur();focusOn(i)}});
$("oC").onchange=e=>{st.cluster=e.target.checked;req()};
$("oT").onchange=e=>{st.shifts=e.target.checked;req()};
$("oS").onchange=e=>{st.splits=e.target.checked;req()};
$("oH").onchange=e=>{st.halos=e.target.checked;req()};
$("oV").onchange=e=>{st.sourced=e.target.checked;refresh()};

function gauge(lab,v,r,lo,hi,c){const p=x=>Math.max(0,Math.min(100,(x+10)*5));return `<div class="gr ${c}"><b>${lab}</b><span class="gv">${fmt(v)} <small style="font-weight:400;color:var(--mut)">&plusmn;${r}</small></span><div class="gt" aria-hidden="true"><i></i><em></em><u style="left:${p(v-r)}%;width:${p(v+r)-p(v-r)}%"></u><s style="left:${p(v)}%"></s></div><div class="gl"><span>${lo}</span><span>${hi}</span></div></div>`}
const THM=["auto","light","dark"],TI={auto:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>Auto',light:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3"/></g></svg>Light',dark:'<svg viewBox="0 0 16 16"><path d="M13 10A6 6 0 0 1 6 3a6 6 0 1 0 7 7z" fill="currentColor"/></svg>Dark'};
function setTheme(themeMode){if(themeMode==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",themeMode);$("thm").innerHTML=TI[themeMode];$("thm").title="Theme: "+themeMode+" (tap to change)";try{localStorage.setItem("thm",themeMode)}catch(e){}}
let thm="auto";try{thm=localStorage.getItem("thm")||"auto"}catch(e){}
setTheme(THM.includes(thm)?thm:"auto");$("thm").onclick=()=>{thm=THM[(THM.indexOf(thm)+1)%3];setTheme(thm)};

// ---------- your taste (Last.fm) ----------
const LFK="c786edf85e9d7a09043082b14c08666d";
const nrm=s=>(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/&/g,"and").replace(/^the /,"").replace(/[^a-z0-9]+/g,"");
function tasteFrom(arts){const P={};arts.forEach(a=>{P[nrm(a.name)]=(P[nrm(a.name)]||0)+(+a.playcount||0)});
 const bandN={};D.forEach(d=>{if(d.band&&d.band!=="solo"){const k=nrm(d.band);bandN[k]=(bandN[k]||0)+1}});
 const w=new Map(),how={};
 D.forEach((d,i)=>{let v=0,src=[];const own=P[nrm(d.name)]||0;if(own){v+=own;src.push(d.name)}
  const al=d.lfmAct&&nrm(d.lfmAct)!==nrm(d.band)&&nrm(d.lfmAct)!==nrm(d.name)?P[nrm(d.lfmAct)]||0:0;if(al){v+=al;src.push(d.lfmAct)}
  if(d.band&&d.band!=="solo"){const b=P[nrm(d.band)]||0;if(b){const n=bandN[nrm(d.band)]||1;v+=b/n;src.push(d.band+(n>1?` (1/${n})`:""))}}
  if(v>0){w.set(i,v);how[i]=src}});
 const hitA=new Set();D.forEach(d=>[d.name,d.lfmAct,d.band].forEach(s=>{if(s&&s!=="solo"&&P[nrm(s)])hitA.add(nrm(s))}));
 let W=0,cx=0,cy=0;w.forEach((v,i)=>{W+=v;cx+=v*D[i].econ;cy+=v*D[i].auth});
 return{w,how,n:w.size,na:hitA.size,cx:W?cx/W:0,cy:W?cy/W:0}}

function tasteShow(user,tData,total){
 const o=$("tOut");
 if(!tData.n){o.innerHTML=`<div class="tres">${t("tasteNone")(esc(user), total.toLocaleString(currentLang==='tr'?'tr-TR':'en-US'))} <button type="button" class="tclr" id="tClr">${t("tasteClearBtn")}</button></div>`;$("tClr").onclick=tasteClear;return}
 const top=[...tData.w.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
 const cen=tData.n>=3?`<div class="tcen">${t("tasteCen")(+tData.cx.toFixed(1), +tData.cy.toFixed(1))}</div>`:`<p class="fnote">${t("tasteCenFew")}</p>`;
 o.innerHTML=`<div class="tres">${t("tasteSummary")(tData.na, esc(user), total.toLocaleString(currentLang==='tr'?'tr-TR':'en-US'), tData.n)} ${cen}<ol>${top.map(([i,v])=>`<li><a href="#" data-i="${i}">${esc(D[i].name)}</a> <small>${t("playsVia")(Math.round(v).toLocaleString(currentLang==='tr'?'tr-TR':'en-US'), tData.how[i].filter(s=>s!==D[i].name))}</small></li>`).join("")}</ol><button type="button" class="tclr" id="tClr">${t("tasteClearBtn")}</button></div>`;
 $("tClr").onclick=tasteClear;o.querySelectorAll("a[data-i]").forEach(a=>a.onclick=e=>{e.preventDefault();focusOn(+a.dataset.i)});
}
function tasteClear(){st.taste=null;$("tOut").innerHTML="";refresh()}

$("tF").onsubmit=async e=>{e.preventDefault();const user=$("tU").value.trim();if(!user)return;const o=$("tOut"),b=$("tGo");b.disabled=true;o.innerHTML=`<p class="fnote">${t("tasteFetching")}</p>`;
 try{const r=await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.gettopartists&user=${encodeURIComponent(user)}&period=overall&limit=1000&api_key=${LFK}&format=json`);const j=await r.json();
  if(j.error){o.innerHTML=`<p class="terr">${j.error===6?t("tasteNoUser"):j.error===17?t("tastePrivate"):t("tasteError")(esc(j.message||"error"))}</p>`;return}
  const arts=(j.topartists&&j.topartists.artist)||[];const tData=tasteFrom(arts);st.taste=tData.n?tData:null;
  try{localStorage.setItem("lfu",user)}catch(_){}
  if(tData.n&&st.view!=="all")setView("all");else refresh();tasteShow(user,tData,arts.length);
  try{window.goatcounter&&goatcounter.count&&goatcounter.count({path:"taste-match",title:"Your taste",event:true})}catch(_){}}
 catch(err){o.innerHTML=`<p class="terr">${t("tasteNetworkErr")}</p>`}
 finally{b.disabled=false}};
try{const u=localStorage.getItem("lfu");if(u)$("tU").value=u}catch(_){}

// ---------- quadrant chips ----------
function setQuad(q){st.quad=q||null;if(st.quad){const x=st.quad[1]==="L"?-4.7:4.7,y=st.quad[0]==="A"?4.7:-4.7;animateTo(10/5.3,x,y,380)}else animateTo(1,0,0,300);refresh()}
$("qchips").addEventListener("click",e=>{const b=e.target.closest("button[data-q]");if(!b)return;setQuad(b.dataset.q===st.quad?null:b.dataset.q)});
</script>
